[project]
name = "wabot-desktop-qml"
version = "0.1.0"
description = "WA Bot desktop client: Qt Quick/QML UI with a thin PySide6 bridge to the Go backend"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8", "segno>=1.6", "dbus-next>=0.2.3"]

[project.optional-dependencies]
build = ["pyinstaller>=6.15,<7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["bridge", "bridge.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
