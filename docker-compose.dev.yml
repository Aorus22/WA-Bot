services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: wa-bot-api-dev
    network_mode: host
    volumes:
      - .:/app
      - /home/aorus/bimalord-bot/database:/app/database
    env_file:
      - .env
    environment:
      - TZ=Asia/Jakarta
      - LIGHTPANDA_CDP_URL=http://localhost:9222
    depends_on:
      - lightpanda
      - redis
    stdin_open: true
    tty: true
    command: tail -f /dev/null

  lightpanda:
    image: lightpanda/browser:nightly
    container_name: wa-bot-lightpanda
    network_mode: host
    restart: always

  redis:
    image: redis:7-alpine
    container_name: wa-bot-redis-dev
    network_mode: host
    restart: always
    volumes:
      - redis_data_dev:/data

  frontend:
    build:
      context: ./web
      dockerfile: ../Dockerfile.fe.dev
    container_name: wa-bot-fe-dev
    network_mode: host
    volumes:
      - ./web:/app
    stdin_open: true
    tty: true
    command: tail -f /dev/null

volumes:
  redis_data_dev:
