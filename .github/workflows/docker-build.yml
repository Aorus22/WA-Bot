name: Build and Deploy Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type YES to proceed with build & deployment"
        required: true
        default: "NO"

concurrency:
  group: build-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Determine if deployment should run
        id: confirm
        run: |
          SHOULD_DEPLOY=false

          echo "🔍 Checking deployment condition..."

          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "🔧 Triggered by manual dispatch."
            if [ "${{ github.event.inputs.confirm }}" == "YES" ]; then
              SHOULD_DEPLOY=true
            fi
          elif [ "${{ github.event_name }}" == "push" ]; then
            echo "🔧 Triggered by push to main."
            if [ -f .deploy-confirm ]; then
              CONTENT=$(cat .deploy-confirm | tr -d '[:space:]')
              if [ "$CONTENT" == "YES" ]; then
                SHOULD_DEPLOY=true
              fi
            else
              echo "⚠️ .deploy-confirm not found."
            fi
          fi

          echo "should-deploy=$SHOULD_DEPLOY" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.confirm.outputs.should-deploy == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        if: steps.confirm.outputs.should-deploy == 'true'
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build Docker Image
        if: steps.confirm.outputs.should-deploy == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: ${{ secrets.DOCKER_IMAGE }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Move cache
        if: steps.confirm.outputs.should-deploy == 'true'
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Login to Docker Hub
        if: steps.confirm.outputs.should-deploy == 'true'
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Push Image to Docker Hub
        if: steps.confirm.outputs.should-deploy == 'true'
        run: |
          docker tag "${{ secrets.DOCKER_IMAGE }}" "${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IMAGE }}"
          docker push "${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IMAGE }}"

      - name: Optional Reset .deploy-confirm
        if: steps.confirm.outputs.should-deploy == 'true' && github.event_name == 'push'
        run: echo "NO" > .deploy-confirm
