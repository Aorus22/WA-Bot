name: Desktop GPUI

# Foundation CI for the Rust GPUI workspace. Scoped by paths filter so it never
# interferes with docker-build.yml (which has no paths filter and owns main).
on:
  push:
    paths:
      - 'desktop-gpui/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/desktop-gpui.yml'
  pull_request:
    paths:
      - 'desktop-gpui/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/desktop-gpui.yml'

jobs:
  build-test:
    name: Build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca407 # v1
        with:
          toolchain: stable
          targets: x86_64-pc-windows-gnu

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c3 # v2.9.2
        with:
          workspaces: desktop-gpui

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-xcb-dev libssl-dev libxkbcommon-x11-dev libxkbcommon-dev mingw-w64

      # --locked everywhere: any Cargo.lock drift fails CI (exact-pin enforcement).
      - name: Build workspace
        run: cargo build --workspace --locked --manifest-path desktop-gpui/Cargo.toml

      - name: Test workspace
        run: cargo test --workspace --locked --manifest-path desktop-gpui/Cargo.toml

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --locked --manifest-path desktop-gpui/Cargo.toml --all-targets -- -D warnings

      # Cross-target safety net on ubuntu (no linker needed for check).
      - name: Check Windows target
        if: runner.os == 'Linux'
        run: cargo check --locked --manifest-path desktop-gpui/Cargo.toml --target x86_64-pc-windows-gnu -p wabot-supervisor -p wabot-settings -p wabot-backend-client

pin-audit:
    name: Exact-pin audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Every dependency pin — long `version = "=x.y.z"` or shorthand `dep = "=x.y.z"` —
      # must use the exact `=x.y.z` syntax. Only [dependencies]/[workspace.dependencies]
      # sections are scanned (skips [workspace.package] metadata like version/edition).
      - name: Reject loose pins
        run: |
          LOOSE=$(awk '
            /^\[[^]]*dependencies[^]]*\]/ { in_deps=1; next }
            /^\[/ { in_deps=0 }
            in_deps && (/^[[:space:]]*[A-Za-z0-9_-]+[[:space:]]*=[[:space:]]*"[^=]/ || /version[[:space:]]*=[[:space:]]*"[^=]/) { print }
          ' desktop-gpui/Cargo.toml desktop-gpui/crates/*/Cargo.toml)
          if [ -n "$LOOSE" ]; then
            echo "ERROR: loose version pin found (must use =x.y.z exact syntax):"
            echo "$LOOSE"
            exit 1
          fi
          echo "PINS_OK"
