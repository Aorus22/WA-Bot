[package]
name = "wabot"
description = "WA Bot desktop shell (GPUI)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "wabot_app"
path = "src/lib.rs"

[[bin]]
name = "wabot"
path = "src/main.rs"

[dependencies]
# IMPORTANT: gpui-pre and gpui-component must always be bumped TOGETHER.
# Partial bumps compile each side separately but fail at the call site (E0277);
# plan 01-01 task 2 guards the pairing. Never use the stale gpui 0.2.2 snapshot.
gpui = { workspace = true }
gpui-reqwest-client = { workspace = true }
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.3" }
gpui-component = { workspace = true }
gpui-kit-assets = { workspace = true }
raw-window-handle = { workspace = true }
wabot-supervisor = { workspace = true }
wabot-settings = { workspace = true }
wabot-backend-client = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
qrcode = { workspace = true }
anyhow = { workspace = true }
flume = { workspace = true }
parking_lot = { workspace = true }

[package.metadata.deb]
name = "wa-bot"
maintainer = "WA Bot Contributors <info@wabot.local>"
copyright = "2026, WA Bot Contributors"
extended-description = "WA Bot Desktop Native Shell (GPUI)"
depends = "$auto, libasound2, libxkbcommon0, libxkbcommon-x11-0"
section = "net"
priority = "optional"
assets = [
    ["target/release/wabot", "usr/bin/wabot", "755"],
]

[package.metadata.wix]
upgrade-guid = "8F6B7670-3882-4DA1-8B39-44F4E46467B9"
path-guid = "543D7B05-648C-4FD2-9864-777E69E819AC"
license = false
eula = false
