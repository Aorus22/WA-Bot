[workspace]
resolver = "2"
members = [
    "crates/supervisor",
    "crates/settings",
    "crates/backend-client",
    "crates/app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["WA Bot contributors"]

[workspace.dependencies]
# Internal crates
wabot-supervisor = { path = "crates/supervisor" }
wabot-settings = { path = "crates/settings" }
wabot-backend-client = { path = "crates/backend-client" }

# Exact pins — gpui is pre-1.0 with real breaking-change churn; every core dep
# is pinned exactly and Cargo.lock is committed (Phase 1, plan 01-01).
# gpui-pre and gpui-component MUST always be bumped together (see crates/app/Cargo.toml).
gpui = { package = "gpui-pre", version = "=0.3.3" }
gpui-component = "=0.6.0"
gpui-kit-assets = "=0.6.0"
raw-window-handle = "=0.6.2"
tokio = { version = "=1.53.1", features = [
    "rt-multi-thread",
    "process",
    "macros",
    "sync",
    "time",
    "net",
] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
# rustls-tls avoids the OpenSSL system dependency on Linux CI.
reqwest = { version = "=0.12.28", default-features = false, features = [
    "json",
    "multipart",
    "rustls-tls",
] }
tokio-tungstenite = { version = "=0.26.2", default-features = false, features = [
    "connect",
    "handshake",
] }
futures-util = "=0.3.32"
flume = "=0.12.0"
dirs = "=6.0.0"
thiserror = "=2.0.20"
anyhow = "=1.0.104"
parking_lot = "=0.12.5"
rand = "=0.10.2"
tempfile = "=3.27.0"
libc = "=0.2.189"
qrcode = { version = "=0.14.1", default-features = false }

[profile.release]
lto = "thin"
