[workspace]
resolver = "2"
members = [
    "crates/supervisor",
    "crates/settings",
    "crates/backend-client",
    "crates/app",
]

[workspace.package]
version = "1.1.0"
edition = "2021"
license = "MIT"
authors = ["WA Bot contributors"]

[workspace.dependencies]
# Internal crates
wabot-supervisor = { path = "crates/supervisor" }
wabot-settings = { path = "crates/settings" }
wabot-backend-client = { path = "crates/backend-client" }

# Exact pins — gpui is pre-1.0 with real breaking-change churn; every core dep
# is pinned exactly and Cargo.lock is committed (Phase 1, plan 01-01).
# gpui-pre and gpui-component MUST always be bumped together (see crates/app/Cargo.toml).
gpui = { package = "gpui-pre", version = "=0.3.8" }
gpui-reqwest-client = { package = "gpui-pre-reqwest-client", version = "=0.3.8" }
gpui-component = "=0.7.1"
gpui-kit-assets = "=0.7.1"
raw-window-handle = "=0.6.2"
tokio = { version = "=1.53.1", features = [
    "rt-multi-thread",
    "process",
    "macros",
    "sync",
    "time",
    "net",
] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
# rustls-tls avoids the OpenSSL system dependency on Linux CI.
reqwest = { version = "=0.12.28", default-features = false, features = [
    "json",
    "multipart",
    "rustls-tls",
    "blocking",
] }
tokio-tungstenite = { version = "=0.26.2", default-features = false, features = [
    "connect",
    "handshake",
] }
futures-util = "=0.3.34"
flume = "=0.12.0"
dirs = "=6.0.0"
thiserror = "=2.0.20"
anyhow = "=1.0.104"
parking_lot = "=0.12.5"
rand = "=0.10.2"
tempfile = "=3.27.0"
libc = "=0.2.189"
qrcode = { version = "=0.14.1", default-features = false }
# Already in the lockfile through gpui; used for OS notifications.
notify-rust = "=4.18.0"
zbus = "=5.19.0"
# System-tray icon (StatusNotifierItem) so a backgrounded app stays visible.
ksni = { version = "=0.3.6", default-features = false, features = ["blocking", "async-io"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
arboard = { version = "=3.6.1", features = ["image-data", "wayland-data-control"] }

# Local GPUI patches (Wayland backdrop blur). Keep both crates on the same rev.
# For upstream GPUI, remove this patch block and run cargo check -p wabot
# --no-default-features once without --locked to refresh Cargo.lock.
[patch.crates-io]
gpui-pre = { path = "../../gpui-wayland-patches/gpui-pre" }
gpui-pre-linux = { path = "../../gpui-wayland-patches/gpui-pre-linux" }
gpui-component = { path = "vendor/gpui-component" }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
